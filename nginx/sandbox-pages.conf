# ALBERT Sandbox: pages shown instead of plain nginx errors.
# Installed to /etc/nginx/albert/sandbox-pages.conf by install.sh (included in
# the server blocks of the site the manager writes); the per-sandbox routes
# refer to these named locations with "error_page".
#
# Desktop of a stopped sandbox (sandboxes stop after a while without activity).
location @albert_sandbox_offline {
	default_type "text/html; charset=utf-8";
	add_header Cache-Control "no-store" always;
	add_header Retry-After "30" always;
	return 503 '<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30"><title>Sandbox gestoppt</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f9;color:#1d2229}
main{max-width:34rem;margin:1rem;padding:2rem 2.25rem;background:#fff;border-radius:12px;border-top:4px solid #006bff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin:0 0 .75rem;font-size:1.3rem}p{margin:.5rem 0;line-height:1.5}small{color:#5c6570}
@media (prefers-color-scheme:dark){body{background:#0f1216;color:#e4e6ea}main{background:#16191e;box-shadow:none}small{color:#9aa3ad}}
</style></head><body><main>
<h1>Diese Sandbox ist gerade nicht gestartet</h1>
<p>Sandboxen werden nach einer Weile ohne Aktivit&auml;t automatisch angehalten. Bitte ALBERT, die Sandbox wieder zu starten. Diese Seite l&auml;dt sich alle 30&nbsp;Sekunden neu und zeigt den Desktop, sobald die Sandbox l&auml;uft.</p>
<p><small>This sandbox is currently stopped. Ask ALBERT to start it again; this page reloads every 30 seconds.</small></p>
</main></body></html>';
}

# Desktop opened without a valid one-time link or desktop session.
location @albert_desktop_expired {
	default_type "text/html; charset=utf-8";
	add_header Cache-Control "no-store" always;
	return 401 '<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link abgelaufen</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f9;color:#1d2229}
main{max-width:34rem;margin:1rem;padding:2rem 2.25rem;background:#fff;border-radius:12px;border-top:4px solid #006bff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{margin:0 0 .75rem;font-size:1.3rem}p{margin:.5rem 0;line-height:1.5}small{color:#5c6570}
@media (prefers-color-scheme:dark){body{background:#0f1216;color:#e4e6ea}main{background:#16191e;box-shadow:none}small{color:#9aa3ad}}
</style></head><body><main>
<h1>Dieser Desktop-Link ist abgelaufen</h1>
<p>Links zum Desktop einer Sandbox gelten nur kurz und nur einmal. Bitte ALBERT, den Desktop erneut zu &ouml;ffnen &ndash; du bekommst dann einen neuen Link.</p>
<p><small>This desktop link has expired or was already used. Ask ALBERT to open the desktop again to get a new link.</small></p>
</main></body></html>';
}

# MCP Hub and file service: API key missing/invalid, or sandbox of another client/user.
location @albert_auth_required {
	default_type application/json;
	add_header Cache-Control "no-store" always;
	return 401 '{"error":"unauthorized","message":"Missing or invalid API key (Authorization: Bearer <API key of the client>)"}';
}
location @albert_auth_forbidden {
	default_type application/json;
	add_header Cache-Control "no-store" always;
	return 403 '{"error":"forbidden","message":"This sandbox belongs to another client or user (check the API key and X-Albert-User)"}';
}
