# ALBERT sandbox: rate-limit zones (http context).
# Installed to /etc/nginx/conf.d/albert-ratelimit.conf by install.sh, so the
# /manager/ route works with or without scripts/setup-tls.sh.
limit_req_zone $binary_remote_addr zone=albert_manager:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=albert_general:10m rate=30r/s;
limit_req_status 429;
