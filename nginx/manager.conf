# ALBERT Sandbox Manager: REST API and admin web UI (/manager/admin/).
# Installed to /etc/nginx/albert/manager.conf by install.sh (server context).
location /manager/ {
	limit_req zone=albert_manager burst=40 nodelay;
	proxy_pass http://127.0.0.1:5001/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Prefix /manager;
	# Creating/starting a sandbox waits for MCP Hub (up to ~2 minutes).
	proxy_read_timeout 600;
	proxy_buffering off;
	proxy_request_buffering off;
	client_max_body_size 1m;
}
